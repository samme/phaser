<div id="debug-container">

    <meter id="debug-draw-count" min="0" max="1000" low="100" optimum="1" value="0" title="Draw Count"></meter>
    <meter id="debug-mutate-count" min="0" max="1000" low="1" optimum="0" value="0" title="Mutate Count"></meter>
    <meter id="debug-pool-size" min="0" max="1000" low="100" optimum="0" value="0" title="Pool (Used/Total)"></meter>
    <meter id="debug-efficiency" min="0" max="1" optimum="1" value="0" title="Efficiency"></meter>
    <meter id="debug-fps" min="0" max="60" high="59" optimum="60" value="0" title="FPS"></meter>
    <meter id="debug-delta" min="0" max="100" low="18" optimum="0" value="0" title="Delta (ms)"></meter>

</div>
