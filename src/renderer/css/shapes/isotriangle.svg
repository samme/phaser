<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
    width="100"
    height="100">
    <g data-shape-type="IsoTriangle">
        <polygon data-element="topFace"
            points="50,25 100,50 0,50"
            fill="lightyellow" />
        <polygon data-element="leftFace"
            points="0,50 50,25 50,100"
            fill="lightcoral" />
        <polygon data-element="rightFace"
            points="50,25 100,50 50,100"
            fill="wheat" />
    </g>
</svg>
