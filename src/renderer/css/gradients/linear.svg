<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
    width="100"
    height="100">
    <defs>
        <linearGradient id="gradient"
            gradientUnits="objectBoundingBox"
            spreadMethod="pad"
            x1="0"
            y1="0"
            x2="1"
            y2="0">
            <stop offset="0"
                stop-color="black"
                stop-opacity="1"/>
            <stop offset="1"
                stop-color="white"
                stop-opacity="1"/>
        </linearGradient>
    </defs>
    <rect width="100%"
        height="100%"
        fill="url(#gradient)"/>
</svg>