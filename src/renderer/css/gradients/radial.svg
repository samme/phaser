<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
    width="100"
    height="100">
    <defs>
        <radialGradient id="gradient"
            gradientUnits="objectBoundingBox"
            spreadMethod="pad"
            cx="0.5"
            cy="0.5"
            r="0.5"
            fx="0.5"
            fy="0.5">
            <stop offset="0"
                stop-color="black"
                stop-opacity="1"/>
            <stop offset="1"
                stop-color="white"
                stop-opacity="1"/>
        </radialGradient>
    </defs>
    <rect width="100%"
        height="100%"
        fill="url(#gradient)"/>
</svg>